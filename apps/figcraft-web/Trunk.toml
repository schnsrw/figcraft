# Build with: trunk build --release   (from apps/figcraft-web)
[build]
target = "index.html"
dist = "../../dist/web"
public_url = "./"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8767

# Pinned tool release trunk downloads (the wasm-bindgen CLI follows Cargo.lock by itself).
[tools]
wasm_opt = "version_123"
