[package]
name = "figcraft-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft's modular cloud application"

[dependencies]
figcraft-cloud-domain = { path = "../../crates/cloud-domain" }
figcraft-cloud-storage = { path = "../../crates/cloud-storage" }
figcraft-cloud-auth = { path = "../../crates/cloud-auth" }
figcraft-cloud-relay = { path = "../../crates/cloud-relay" }
# S4 auth wiring: HMAC for share-session cookies (already built for rustls and the OIDC client).
ring = "0.17"
figcraft-collab-net = { workspace = true }
# S6-041: restore builds the target state with the collaboration crate's types.
figcraft-collab = { workspace = true }
sqlx = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal"] }
axum = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
# S5-012: the drain test starts the real binary and joins its relay as a client.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true
