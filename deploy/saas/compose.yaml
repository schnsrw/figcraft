name: figcraft-saas

# D-001: PostgreSQL, Redis and SeaweedFS are digest-pinned in env.example.
# This topology is not yet a healthy SaaS stack: the cloud API/relay/worker runtime is pending.
services:
  gateway:
    image: ${CADDY_IMAGE:?set a reviewed Caddy image reference}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    image: figcraft-web:local
    build:
      context: ../..
      dockerfile: deploy/saas/web.Dockerfile
      args:
        CADDY_IMAGE: ${CADDY_IMAGE:?set a reviewed Caddy image reference}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3

  cloud:
    image: figcraft-cloud:local
    build:
      context: ../..
      dockerfile: deploy/saas/cloud.Dockerfile
    environment:
      FIGCRAFT_ENV: ${FIGCRAFT_ENV:-development}
      FIGCRAFT_DEPLOYMENT: ${FIGCRAFT_DEPLOYMENT:-single}
      FIGCRAFT_ROLE: ${FIGCRAFT_ROLE:-all}
      FIGCRAFT_PUBLIC_URL: ${FIGCRAFT_PUBLIC_URL:-http://127.0.0.1:8080}
      FIGCRAFT_SINGLE_TENANT_ID: ${FIGCRAFT_SINGLE_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-figcraft}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://identity.invalid}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-figcraft-local}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-figcraft-local}
      SESSION_SIGNING_KEY_FILE: /run/secrets/session_signing_key
      EMBED_ISSUER_CONFIG_FILE: ${EMBED_ISSUER_CONFIG_FILE:-/etc/figcraft/embed-issuers.toml}
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - database_url
      - redis_url
      - s3_access_key
      - s3_secret_key
      - oidc_client_secret
      - session_signing_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/figcraft-cloud", "--check-ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: ${POSTGRES_IMAGE:?D-001 requires a reviewed PostgreSQL image reference}
    environment:
      POSTGRES_USER: figcraft
      POSTGRES_DB: figcraft
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql; keep the target tied to the image major.
      - postgres_data:${POSTGRES_DATA_DIR:?D-001 requires the selected PostgreSQL image volume path}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figcraft -d figcraft"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:?D-001 requires a reviewed Redis image reference}
    command: ["redis-server", "/run/secrets/redis_conf", "--dir", "/data", "--appendonly", "yes"]
    secrets:
      - redis_conf
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      # `-x` reads the password on stdin; no secret enters argv or the healthcheck output.
      test: ["CMD-SHELL", "redis-cli -e -x AUTH < /run/secrets/redis_password >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?D-001 requires a reviewed SeaweedFS image reference}
    command:
      - mini
      - -dir=/data
      - -s3.config=/run/secrets/seaweedfs_s3_config
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -admin.ui=false
      - -webdav=false
      - -bucket=${S3_BUCKET:-figcraft}
    secrets:
      - seaweedfs_s3_config
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--silent", "--show-error", "--fail", "http://127.0.0.1:8333/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  seaweedfs-init:
    image: ${SEAWEEDFS_IMAGE:?D-001 requires a reviewed SeaweedFS image reference}
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-figcraft}
    command:
      - |
        bucket="$$S3_BUCKET"
        test "$${#bucket}" -ge 3 && test "$${#bucket}" -le 63
        case "$$bucket" in *[!a-z0-9.-]*|.*|*.) exit 1;; esac
        printf 's3.bucket.versioning -name %s -enable\n' "$$bucket" |
          weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
        status=$$(printf 's3.bucket.versioning -name %s\n' "$$bucket" |
          weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888)
        printf '%s\n' "$$status"
        printf '%s\n' "$$status" | grep -Fq 'Versioning: Enabled'
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "on-failure:10"

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:

secrets:
  database_url:
    file: ./secrets/database_url
  redis_url:
    file: ./secrets/redis_url
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  session_signing_key:
    file: ./secrets/session_signing_key
  postgres_password:
    file: ./secrets/postgres_password
  redis_conf:
    file: ./secrets/redis.conf
  redis_password:
    file: ./secrets/redis_password
  seaweedfs_s3_config:
    file: ./secrets/seaweedfs-s3-config.json
