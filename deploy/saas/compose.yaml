name: figcraft-saas

# D-001: PostgreSQL, Redis and SeaweedFS are digest-pinned in env.example.
# This topology is not yet a healthy SaaS stack: the cloud API/relay/worker runtime is pending.
x-cloud-environment: &cloud-environment
  FIGCRAFT_ENV: ${FIGCRAFT_ENV:-development}
  FIGCRAFT_DEPLOYMENT: ${FIGCRAFT_DEPLOYMENT:-single}
  FIGCRAFT_ROLE: ${FIGCRAFT_ROLE:-all}
  FIGCRAFT_PUBLIC_URL: ${FIGCRAFT_PUBLIC_URL:-http://127.0.0.1:8080}
  FIGCRAFT_SINGLE_TENANT_ID: ${FIGCRAFT_SINGLE_TENANT_ID:-00000000-0000-0000-0000-000000000001}
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-figcraft}
  S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  OIDC_ISSUER: ${OIDC_ISSUER:-https://identity.invalid}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-figcraft-local}
  OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-figcraft-local}
  SESSION_SIGNING_KEY_FILE: /run/secrets/session_signing_key
  EMBED_ISSUER_CONFIG_FILE: ${EMBED_ISSUER_CONFIG_FILE:-/etc/figcraft/embed-issuers.toml}
  RUST_LOG: ${RUST_LOG:-info}

x-cloud-settings: &cloud-settings
  image: figcraft-cloud:local
  build:
    context: ../..
    dockerfile: deploy/saas/cloud.Dockerfile
  environment: *cloud-environment
  secrets:
    - database_url
    - redis_url
    - s3_access_key
    - s3_secret_key
    - oidc_client_secret
    - session_signing_key

x-role-provision: &role-provision
  image: figcraft-cloud:local
  build:
    context: ../..
    dockerfile: deploy/saas/cloud.Dockerfile
  command: ["--provision-db-roles"]
  restart: "no"
  environment:
    DATABASE_ADMIN_URL_FILE: /run/secrets/admin_database_url
    DATABASE_MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_password
    DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/runtime_password
  secrets:
    - admin_database_url
    - migrator_password
    - runtime_password

services:
  gateway:
    image: ${CADDY_IMAGE:?set a reviewed Caddy image reference}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    image: figcraft-web:local
    build:
      context: ../..
      dockerfile: deploy/saas/web.Dockerfile
      args:
        CADDY_IMAGE: ${CADDY_IMAGE:?set a reviewed Caddy image reference}
    # Runtime branding, rendered into /branding.json per request: change these and restart the
    # web container (no rebuild). Web service only: the cloud service rejects unknown FIGCRAFT_*
    # settings. See docs/saas/branding-and-configuration.md.
    environment:
      FIGCRAFT_BRAND_PRODUCT_NAME: ${FIGCRAFT_BRAND_PRODUCT_NAME:-}
      FIGCRAFT_BRAND_SHORT_NAME: ${FIGCRAFT_BRAND_SHORT_NAME:-}
      FIGCRAFT_BRAND_PRIMARY_COLOR: ${FIGCRAFT_BRAND_PRIMARY_COLOR:-}
      FIGCRAFT_BRAND_ACCENT_COLOR: ${FIGCRAFT_BRAND_ACCENT_COLOR:-}
      FIGCRAFT_BRAND_LOGO_URL: ${FIGCRAFT_BRAND_LOGO_URL:-}
      FIGCRAFT_BRAND_FAVICON_URL: ${FIGCRAFT_BRAND_FAVICON_URL:-}
      FIGCRAFT_BRAND_SUPPORT_URL: ${FIGCRAFT_BRAND_SUPPORT_URL:-}
      FIGCRAFT_BRAND_TERMS_URL: ${FIGCRAFT_BRAND_TERMS_URL:-}
      FIGCRAFT_BRAND_PRIVACY_URL: ${FIGCRAFT_BRAND_PRIVACY_URL:-}
      FIGCRAFT_BRAND_FOOTER_TEXT: ${FIGCRAFT_BRAND_FOOTER_TEXT:-}
    # Optional deployer brand assets, served read-only at /brand/* (for example
    # FIGCRAFT_BRAND_LOGO_URL=/brand/logo.svg). Uncomment and point at a directory you own:
    # volumes:
    #   - ./brand:/srv/brand:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3

  cloud:
    <<: *cloud-settings
    # 8081: API and health; 8082: the collaboration relay (the gateway routes /ws/v1/collab to it).
    # Neither is published on the host: everything goes through the gateway.
    expose:
      - "8081"
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      role-grants:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/figcraft-cloud", "--check-ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  migrate:
    <<: *cloud-settings
    command: ["--migrate"]
    environment:
      <<: *cloud-environment
      DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - migration_database_url
      - redis_url
      - s3_access_key
      - s3_secret_key
      - oidc_client_secret
      - session_signing_key
    restart: "no"
    depends_on:
      role-provision:
        condition: service_completed_successfully

  role-provision:
    <<: *role-provision
    depends_on:
      postgres:
        condition: service_healthy

  role-grants:
    <<: *role-provision
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: ${POSTGRES_IMAGE:?D-001 requires a reviewed PostgreSQL image reference}
    environment:
      POSTGRES_USER: figcraft
      POSTGRES_DB: figcraft
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql; keep the target tied to the image major.
      - postgres_data:${POSTGRES_DATA_DIR:?D-001 requires the selected PostgreSQL image volume path}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figcraft -d figcraft"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:?D-001 requires a reviewed Redis image reference}
    command: ["redis-server", "/run/secrets/redis_conf", "--dir", "/data", "--appendonly", "yes"]
    secrets:
      - redis_conf
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      # `-x` reads the password on stdin; no secret enters argv or the healthcheck output.
      test: ["CMD-SHELL", "redis-cli -e -x AUTH < /run/secrets/redis_password >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?D-001 requires a reviewed SeaweedFS image reference}
    command:
      - mini
      - -dir=/data
      - -s3.config=/run/secrets/seaweedfs_s3_config
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -admin.ui=false
      - -webdav=false
      - -bucket=${S3_BUCKET:-figcraft}
    secrets:
      - seaweedfs_s3_config
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--silent", "--show-error", "--fail", "http://127.0.0.1:8333/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # S3-014: the cloud image's explicit `--init-object-store` creates the bucket if missing,
  # enables and verifies versioning and applies the lifecycle rules through the S3 API, then
  # reads every setting back. It is idempotent and never runs as part of normal startup.
  seaweedfs-init:
    <<: *cloud-settings
    command: ["--init-object-store"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "on-failure:10"

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:

secrets:
  admin_database_url:
    file: ./secrets/admin_database_url
  migration_database_url:
    file: ./secrets/migration_database_url
  database_url:
    file: ./secrets/database_url
  migrator_password:
    file: ./secrets/migrator_password
  runtime_password:
    file: ./secrets/runtime_password
  redis_url:
    file: ./secrets/redis_url
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  session_signing_key:
    file: ./secrets/session_signing_key
  postgres_password:
    file: ./secrets/postgres_password
  redis_conf:
    file: ./secrets/redis.conf
  redis_password:
    file: ./secrets/redis_password
  seaweedfs_s3_config:
    file: ./secrets/seaweedfs-s3-config.json
