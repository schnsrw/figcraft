[package]
name = "figcraft-cloud-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Distributed collaboration relay for FigCraft Cloud"

[dependencies]
figcraft-cloud-domain = { path = "../cloud-domain" }
figcraft-cloud-storage = { path = "../cloud-storage" }
figcraft-collab = { workspace = true }
figcraft-collab-net = { workspace = true }
log = { workspace = true }
# S6-041: restoring a version submits one batch to the room as an ordinary client (blocking client).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sqlx = { workspace = true }
# The collaboration hub's backend is synchronous: it drives storage on a runtime of its own.
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[dev-dependencies]
figcraft-doc = { workspace = true }
# S5-019: the app's own network client (an engine session with the network link) joins the relay.
figcraft-engine = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
