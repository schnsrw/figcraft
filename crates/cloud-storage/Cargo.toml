[package]
name = "figcraft-cloud-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Durable metadata and object storage adapters for FigCraft Cloud"

[dependencies]
figcraft-cloud-domain = { path = "../cloud-domain" }
figcraft-collab = { workspace = true }
sqlx = { workspace = true }
rusty-s3 = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
webpki-roots = "1"
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
crc32fast = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
