[package]
name = "figcraft-cloud-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Durable metadata and object storage adapters for FigCraft Cloud"

[dependencies]
figcraft-cloud-domain = { path = "../cloud-domain" }
figcraft-collab = { workspace = true }
sqlx = { workspace = true }
rusty-s3 = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
webpki-roots = "1"
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
crc32fast = { workspace = true }
sha2 = { workspace = true }
# S3-014: hand-signed bucket versioning/lifecycle requests (`rusty_s3::signing::sign` takes a
# `jiff` timestamp), `Content-MD5` for lifecycle bodies and bounded XML parsing.
jiff = { version = "0.2", default-features = false, features = ["std"] }
md-5 = "0.11"
base64 = { workspace = true }
# S6-013: AES-256-GCM for webhook secrets at rest and the CSPRNG; already built for rustls.
ring = "0.17"
# S6-014: resolving webhook destinations and the delivery timeouts (net, rt, time only).
tokio = { workspace = true }
roxmltree = "0.21"
# S6-032: NFC-normalised logins; already resolved in the workspace (MIT OR Apache-2.0).
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
figcraft-doc = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "io-util"] }

[lints]
workspace = true
