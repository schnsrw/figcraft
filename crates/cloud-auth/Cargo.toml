[package]
name = "figcraft-cloud-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Authentication and authorization adapters for FigCraft Cloud"

[dependencies]
figcraft-cloud-domain = { path = "../cloud-domain" }
# S4-001: the OIDC login flow records attempts and resolves identities through the storage
# repositories (documented same-layer edge in xtask/src/layers.rs).
figcraft-cloud-storage = { path = "../cloud-storage" }
openidconnect = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
webpki-roots = "1"
url = "2"
sqlx = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
base64 = { workspace = true }
# S6-003: verifies embed-token signatures (Ed25519, ECDSA P-256); already built for rustls.
ring = "0.17"
sha2 = { workspace = true }
# Already built for openidconnect: the ID-token verifier's clock is a chrono time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# S6-033: Argon2id password hashing (RustCrypto, MIT OR Apache-2.0), used through raw
# `hash_password_into` with our own PHC string; no password-hash or RNG crate. See
# docs/saas/password-hashing-decision.md.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# S6-033: NFKC-normalised passwords (already resolved in the workspace).
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "form"] }
rsa = { version = "0.9", features = ["sha2", "getrandom"] }

[lints]
workspace = true
