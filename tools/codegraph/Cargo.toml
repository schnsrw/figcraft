# Developer tooling (fork addition): an incremental code-intelligence graph for coding agents.
# A workspace of its own, so it never joins the product build, its lock file or `cargo xtask ci`.
[workspace]

[package]
name = "codegraph"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Incremental SQLite code graph (tree-sitter + rust-analyzer SCIP) with a CLI and a read-only MCP server"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
scip = "0.10"
protobuf = "3"
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# `let v = st.query_map(..)?; v` keeps the statement borrowing `st` alive long enough.
let_and_return = "allow"
